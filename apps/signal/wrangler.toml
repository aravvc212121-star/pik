name = "picbeam-signal"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Durable Objects
[durable_objects]
bindings = [
  { name = "SESSION_DO", class_name = "SessionDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["SessionDO"]

# Environment variables
[vars]
ALLOWED_ORIGIN = "https://picbeam.app"

# No logging, no analytics, no observability
[observability]
enabled = false
