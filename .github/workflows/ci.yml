name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build protocol
        run: npm run build --workspace=packages/protocol

      - name: Typecheck
        run: |
          npm run typecheck --workspace=packages/protocol
          npm run typecheck --workspace=apps/web

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Unit tests
        run: npm run test:unit --workspace=apps/web --if-present

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check bundle size
        run: |
          TOTAL=$(find apps/web/dist/assets -name '*.js' | xargs gzip -c | wc -c)
          echo "Total JS gzipped: $TOTAL bytes"
          if [ "$TOTAL" -gt 122880 ]; then
            echo "ERROR: JS bundle exceeds 120 KB gzipped"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: |
          npm run build --workspace=packages/protocol
          npm run build --workspace=apps/web

      - name: Run e2e tests
        run: npm run test:e2e --workspace=apps/web --if-present
